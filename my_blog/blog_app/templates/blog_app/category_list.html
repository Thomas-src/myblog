{% extends 'base.html' %}
{% block title %}Liste des catégories{% endblock %}

{% block content %}
{% load static %}

<h2>Liste des catégories</h2>

<ul>
  {% for category in categorys %}

  {% endfor %}
</ul>

{% endblock %}
