{% extends 'base.html' %}
{% block title %}Liste des posts{% endblock %}

{% block content %}
{% load static %}

<h2>Liste des posts</h2>

<ul>
  {% for post in posts %}
  <li><a href="{% url 'post' id=post.id %}">{{ post.title }}</a></li>
  {% empty %}
  <li>Aucun résultat</li>
  {% endfor %}
</ul>

{% endblock %}
