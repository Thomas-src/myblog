{% load i18n %}

{% for field in form %}
    <div class="space-y-2">
        <label for="{{ field.id_for_label }}"
               class="block text-sm font-medium text-gray-700">
            {{ field.label }}
        </label>

        {{ field }}

        {% if field.help_text %}
            <p class="text-sm text-gray-500">
                {{ field.help_text }}
            </p>
        {% endif %}

        {% for error in field.errors %}
            <p class="text-sm text-red-600">
                {{ error }}
            </p>
        {% endfor %}
    </div>
{% endfor %}

{% if form.non_field_errors %}
    <div class="rounded-md bg-red-50 p-3 text-sm text-red-700">
        {% for error in form.non_field_errors %}
            <p>{{ error }}</p>
        {% endfor %}
    </div>
{% endif %}

<div class="pt-2">
    <input type="submit" value="{{ action_text|default:_("Enregistrer") }}"
                class="w-full border border-gray-900 px-4 py-2 text-sm text-gray-900 hover:bg-gray-900 hover:text-white transition-colors cursor-pointer">
        
    </button>
</div>
