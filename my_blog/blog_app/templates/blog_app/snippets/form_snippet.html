<div class="space-y-5">

    {% for field in form %}

        <div>
            <label for="{{ field.id_for_label }}"
                   class="block text-sm text-gray-700 mb-1">
                {{ field.label }}{% if field.field.required %}*{% endif %}
            </label>

            {{ field }}

            {% if field.errors %}
                <div class="mt-1 text-sm text-red-600">
                    {{ field.errors }}
                </div>
            {% endif %}
        </div>

    {% endfor %}

    <input type="submit"
           value="{{ action_text|default:'Créer' }}"
           class="w-full border border-gray-900 px-4 py-2 text-sm text-gray-900 hover:bg-gray-900 hover:text-white transition-colors cursor-pointer">

</div>
