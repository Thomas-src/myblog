{% extends 'base.html' %}

{% block title %}
Modification de la catégorie {{ category.name }}
{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto px-4 py-10">

    <h1 class="text-xl font-semibold text-gray-900 mb-6">
        Modifier la catégorie
        <span class="text-gray-500">{{ category.name }}</span>
    </h1>

    <form method="post" action="{% url 'category_edit' id=category.id %}" class="space-y-5">
        {% csrf_token %}

        <div>
            <label for="category_name" class="block text-sm text-gray-700 mb-1">
                Nouveau nom de la catégorie*
            </label>

            <input required type="text" name="category_name" id="category_name" m
                value="{{ category_name|default:category.name }}"
                class="w-full border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-gray-500">
        </div>

        <div class="flex gap-3">

            <a href="{% url 'category' id=category.id %}" class="w-full border border-gray-300 px-4 py-2 text-sm
                       text-gray-700 text-center
                       hover:bg-gray-100 transition-colors">
                Annuler
            </a>

            <input type="submit" value="Enregistrer"
                class="w-full border border-gray-900 px-4 py-2 text-sm text-gray-900 hover:bg-gray-900 hover:text-white transition-colors cursor-pointer">
        </div>

    </form>

</div>

{% endblock %}
