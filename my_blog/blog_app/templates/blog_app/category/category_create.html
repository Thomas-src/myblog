{% extends 'base.html' %}
{% load static i18n %}

{% block title %}{% trans "Créer une catégorie" %}{% endblock %}
{% block content %}

<div class="max-w-xl mx-auto px-4 py-10">
    <h1 class="text-xl font-semibold text-gray-900 mb-6">{% trans "Créer une catégorie" %}</h1>

    <form method="post" action="{% url 'category_create' %}" enctype="multipart/form-data" class="space-y-5">
        {% csrf_token %}

        {{ form }}
    </form>
</div>

{% endblock %}
