{% extends 'base.html' %}
{% block title %}Créer un post{% endblock %}

{% block content %}
{% load static %}

<div class="max-w-xl mx-auto px-4 py-10">
    <h2 class="text-xl font-semibold text-gray-900 mb-6">Créer votre post</h2>

    {% if error %}
    <p class="text-sm text-red-600 mb-4">{{ error }}</p>
    {% endif %}

    <form method="post" action="{% url 'post_create' %}" class="space-y-5">
        {% csrf_token %}

        <div>
            <label for="title_post" class="block text-sm text-gray-700 mb-1">Titre du post*</label>
            <input type="text" name="title" id="title_post" value="{{form.title}}" class="w-full border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-gray-500">
        </div>

        <div>
            <label for="description" class="block text-sm text-gray-700 mb-1">Description*</label>
            <textarea name="description" placeholder="Description" id="description" rows="5" class="w-full border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-gray-500">{{form.description}}</textarea>
        </div>

        <div>
            <label for="image" class="block text-sm text-gray-700 mb-1">Lien image</label>
            <input type="text" name="image" placeholder="https://www.google.com" id="image" value="{{form.image}}" class="w-full border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-gray-500">
        </div>

        <div>
            <label for="categories" class="block text-sm text-gray-700 mb-1">Catégories</label>
            <select name="categories" id="categories" multiple class="w-full border border-gray-300 px-3 py-2 text-sm bg-white focus:outline-none focus:border-gray-500">
                {% for category in categories %}
                <option value="{{ category.id }}" {% if category.id in form.categories %}selected{% endif %}>{{ category.name }}</option>
                {% empty %}
                <option disabled value="-1">Aucune catégorie</option>
                {% endfor %}
            </select>
        </div>

        <input type="submit" value="Publier" class="w-full border border-gray-900 px-4 py-2 text-sm text-gray-900 hover:bg-gray-900 hover:text-white transition-colors cursor-pointer">
    </form>
</div>

{% endblock %}
