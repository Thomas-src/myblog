{% extends 'base.html' %}
{% block title %}Supprimer une catégorie{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto px-4 py-10">
    <h1 class="text-xl font-semibold text-gray-900 mb-6">Supprimer une catégorie</h1>

    <div class="mb-6">
        <span class="block text-sm text-gray-700 mb-1">Nom de la catégorie</span>
        <p class="w-full border border-gray-200 bg-gray-50 px-3 py-2 text-sm text-gray-900">
            {{ category.name }}
        </p>
    </div>

    <form method="post" action="{% url 'category_delete' id=category.id %}" id="delete-form" class="flex gap-3">
        {% csrf_token %}

        <a href="{% url 'category' id=category.id %}"
            class="w-full border border-gray-300 px-4 py-2 text-center text-sm text-gray-700 transition-colors hover:bg-gray-100">
            Annuler
        </a>

        <button type="submit"
            class="w-full border border-red-700 bg-red-700 px-4 py-2 text-sm text-white transition-colors hover:bg-red-800 cursor-pointer">
            Supprimer
        </button>
    </form>
</div>

<script>
    document.getElementById('delete-form').addEventListener('submit', function (event) {
        const confirmed = confirm('Voulez-vous vraiment supprimer la catégorie {{ category.name }} ?');
        if (!confirmed) {
            event.preventDefault();
        }
    });
</script>

{% endblock %}
