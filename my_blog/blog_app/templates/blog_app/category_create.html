{% extends 'base.html' %}
{% block title %}Créer une catégorie{% endblock %}

{% block content %}
{% load static %}

<div class="max-w-xl mx-auto px-4 py-10">
    <h1 class="text-xl font-semibold text-gray-900 mb-6">Créer une catégorie</h1>

    <form method="post" action="{% url 'category_create' %}" enctype="multipart/form-data" class="space-y-5" >
        {% csrf_token %}

        <div>
            <label for="category_name" class="block text-sm text-gray-700 mb-1">Titre de la catégorie*</label>
            <input required type="text" name="category_name" id="category_name" value="{{form.title_post}}" class="w-full border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-gray-500">
        </div>

        <input type="submit" value="Créer" class="w-full border border-gray-900 px-4 py-2 text-sm text-gray-900 hover:bg-gray-900 hover:text-white transition-colors cursor-pointer">
    </form>
</div>

{% endblock %}
